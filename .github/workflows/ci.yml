name: CI

# CI only: checks, build, scan. Nothing is pushed to a registry and nothing is deployed.
on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Read-only token for every job. No job needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: food-delivery-ui:ci

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same image the Dockerfile builds with. The app does not compile on newer Flutter
    # (BottomNavigationBarItem(title:) was removed after 2.5), so the SDK is pinned here.
    container:
      image: cirrusci/flutter:2.5.3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve dependencies
        run: flutter pub get

      # Informational for now: 5 files in lib/ from the original author are not
      # `flutter format`-clean. Remove continue-on-error once they are formatted.
      - name: Check formatting
        continue-on-error: true
        run: flutter format --dry-run --set-exit-if-changed lib test

      # Errors and warnings fail the build. The legacy code has ~23 info-level notes
      # (unused imports, deprecations) that are reported but not blocking.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # The repo has no web/ folder, so generate it in this throwaway workspace first.
      - name: Build Flutter web
        run: |
          flutter create --platforms=web --project-name flutter_app .
          flutter build web --release --web-renderer html

  docker:
    name: Docker build, smoke test and vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      # This is also the Flutter web build: the Dockerfile runs `flutter build web`.
      # load: true keeps the image local to the runner; push: false means no registry.
      - name: Build image
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name ui -p 127.0.0.1:8080:8080 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges "$IMAGE"
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
          test "$(docker exec ui id -u)" != "0"
          docker rm -f ui

      # Report-only: findings are saved as an artifact but never fail the build.
      # To enforce a gate later, set exit-code to "1".
      - name: Vulnerability scan (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: ignore
          retention-days: 14

  kubernetes-manifests:
    name: Render Kubernetes manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Offline render only. It needs no cluster and applies nothing.
      - name: kustomize build
        run: |
          kubectl kustomize k8s > rendered.yaml
          grep -q '^kind: Deployment' rendered.yaml
          grep -q '^kind: Service' rendered.yaml
          grep -q '^kind: Namespace' rendered.yaml
