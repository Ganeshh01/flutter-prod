apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: food-delivery

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

# Currently a no-op: it maps the image to itself. It is the single place to override the
# image later, e.g. `kustomize edit set image food-delivery-ui=<registry>/food-delivery-ui:<tag>`.
images:
  - name: food-delivery-ui
    newName: food-delivery-ui
    newTag: local
