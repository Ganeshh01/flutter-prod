apiVersion: v1
kind: Service
metadata:
  name: food-delivery-ui
  labels:
    app.kubernetes.io/name: food-delivery-ui
    app.kubernetes.io/part-of: food-delivery
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: food-delivery-ui
  ports:
    - name: http
      port: 80
      targetPort: http   # container port named "http" (8080) in the Deployment
