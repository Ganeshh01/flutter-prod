apiVersion: v1
kind: Pod
metadata:
  name: image-failure-test
  namespace: food-delivery
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: image-failure-test
      image: nginx:does-not-exist
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
