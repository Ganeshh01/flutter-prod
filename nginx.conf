server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Health endpoint used by the Dockerfile HEALTHCHECK and by the Kubernetes readiness
    # and liveness probes. Not logged, to keep access logs clean.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Entry point and service worker must always be revalidated or users get stale builds.
    # (expires, not add_header: a location-level add_header would drop the headers above.)
    location ~ ^/(index\.html|flutter_service_worker\.js)$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
