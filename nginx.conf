# The path the client asked for, without the query string. $uri would show the
# internal rewrite (/index.html) for every SPA route, and $request_uri keeps the
# query string, which can carry tokens.
map $request_uri $request_path {
    "~^(?<p>[^?]*)" $p;
    default         "";
}

# One JSON object per request, for automated analysis (jq, log shippers, the incident
# agent). escape=json keeps every line valid JSON.
log_format json_access escape=json
    '{"time":"$time_iso8601","level":"info","msg":"request",'
    '"request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","path":"$request_path","status":$status,'
    '"bytes":$body_bytes_sent,"duration_s":$request_time,'
    '"user_agent":"$http_user_agent","referer":"$http_referer"}';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # /var/log/nginx/access.log is a symlink to /dev/stdout in the base image, so this
    # shows up in `docker logs` and `kubectl logs` with no writable log directory.
    access_log /var/log/nginx/access.log json_access;

    # Lets a user quote an ID from the browser's response headers to find the log line.
    add_header X-Request-ID $request_id always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Health endpoint used by the Dockerfile HEALTHCHECK and by the Kubernetes readiness
    # and liveness probes. Not logged, to keep access logs clean.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Entry point and service worker must always be revalidated or users get stale builds.
    # (expires, not add_header: a location-level add_header would drop the headers above.)
    location ~ ^/(index\.html|flutter_service_worker\.js)$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
